# Example Nginx configuration for Agent Tunnel Website
# This should be adapted to your server environment.

server {
    listen 80;
    server_name agent-tunnel.com; # Replace with your domain

    root /var/www/agent-tunnel-website/dist;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    # Static assets (with hash in filename)
    # Vite puts these in assets/ directory
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Favicon and other root static files
    location ~* \.(?:webp|png|ico|svg|xml|webmanifest)$ {
        expires 1M;
        add_header Cache-Control "public";
        access_log off;
    }

    # Main entry point
    location / {
        # Avoid caching index.html so updates are immediate
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        try_files $uri $uri/ /index.html;
    }

    # Handle 404
    error_page 404 /index.html;
}
